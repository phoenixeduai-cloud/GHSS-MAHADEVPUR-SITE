<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="dashboard">
<h2>Welcome <span id="user"></span></h2>
<p id="role"></p>

<a href="index.html" class="primary">Go to Website</a>
<button onclick="logout()">Logout</button>
</div>

<script>
document.getElementById("user").innerText = localStorage.getItem("user");
document.getElementById("role").innerText = "Role: " + localStorage.getItem("role");

function logout(){
  localStorage.clear();
  window.location.href="login.html";
}
</script>

</body>
</html>
